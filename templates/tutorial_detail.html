<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ tutorial.title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Body styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffe3c5, #fff8f0);
            margin: 0;
            padding: 0;
        }

        /* Tutorial container */
        .tutorial-container {
            max-width: 800px;
            margin: 50px auto;
            padding: 30px;
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .tutorial-container:hover {
            transform: translateY(-5px);
        }

        /* Title */
        .tutorial-container h1 {
            color: #ff9800;
            margin-bottom: 15px;
            font-weight: 700;
            font-size: 2.5rem;
            position: relative;
            display: inline-block;
        }

        .tutorial-container h1::after {
            content: "✨";
            margin-left: 10px;
            animation: sparkle 1s infinite alternate;
        }

        @keyframes sparkle {
            from { transform: scale(1); opacity: 0.6; }
            to { transform: scale(1.3); opacity: 1; }
        }

        /* Description */
        .tutorial-container p {
            font-size: 1.2rem;
            color: #555;
            margin-bottom: 25px;
        }

        /* Video */
        .tutorial-container iframe {
            border-radius: 10px;
            width: 100%;
            height: 450px;
        }

        /* Back button */
        .btn-back {
            margin-top: 20px;
            background-color: #ff9800;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            background-color: #e68a00;
            transform: scale(1.05);
        }
    </style>
</head>

<body>
  

    <div class="tutorial-container">
        <h1>{{ tutorial.title }}</h1>
        <p>{{ tutorial.description }}</p>
        
        <div class="ratio ratio-16x9 mt-3">
            <iframe src="{{ tutorial.video }}" allowfullscreen></iframe>
        </div>
        
        <a href="/" class="btn-back">⬅ Back to Home</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
