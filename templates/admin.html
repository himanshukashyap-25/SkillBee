<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Login | SkillBee</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to right, #000, #333);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-container {
      background: white;
      width: 380px;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
      text-align: center;
    }

    .logo img {
      height: 80px;
      margin-bottom: 15px;
    }

    h2 {
      font-weight: 700;
      color: #000;
      margin-bottom: 5px;
    }

    p {
      color: #555;
      margin-bottom: 25px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
      outline: none;
      transition: 0.3s;
    }

    input:focus {
      border-color: #f1c40f;
      box-shadow: 0 0 8px rgba(241,196,15,0.4);
    }

    button {
      width: 100%;
      padding: 12px;
      background: #f1c40f;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 15px;
    }

    button:hover {
      background: #d4ac0d;
    }

    .back-link {
      display: block;
      margin-top: 15px;
      color: #000;
      text-decoration: none;
      font-size: 14px;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="login-container">
    
    <!-- Logo -->
    <div class="logo">
      <img src="{{ url_for('static', filename='skillbee-logo.png') }}" alt="SkillBee Logo">
    </div>

    <h2>Admin Login</h2>
    <p>Enter your admin password to access dashboard</p>

    <!-- LOGIN FORM (POST to Flask route) -->
    <form action="/admin-login" method="POST">
      <input type="password" name="password" placeholder="Enter Admin Password" required>
      <button type="submit">Login</button>
    </form>

    <a href="/" class="back-link">⬅ Back to Homepage</a>

  </div>

</body>
</html>
