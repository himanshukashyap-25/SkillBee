<!DOCTYPE html>
<html>
<head>
    <title>{{ course.name }} - SkillBee</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .course-container { margin-top: 40px; }
        .course-thumbnail { width: 100%; border-radius: 10px; margin-bottom: 15px; }
        iframe { border-radius: 10px; }
        @media (max-width: 768px) { iframe { height: 300px; } }
    </style>
</head>
<body>

<div class="container course-container">
    <div class="row">

        <!-- Video -->
        <div class="col-md-6">
            <iframe width="100%" height="400" 
                    src="{{ course.video_url }}" 
                    frameborder="0" allowfullscreen></iframe>
        </div>

        <!-- Content -->
        <div class="col-md-6">
            <img src="{{ course.thumbnail }}" alt="{{ course.name }}" class="course-thumbnail">
            <h2>{{ course.name }}</h2>
            <p>{{ course.description }}</p>
            <h5>Course Content:</h5>
            <ul>
                {% for item in course.content %}
                    <li>{{ item }}</li>
                {% endfor %}
            </ul>
        </div>

    </div>
</div>

</body>
</html>
